name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BROWSER_TOOLS_BROWSER: managed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --no-shell
      - name: Allow Chromium sandbox user namespaces
        run: |
          browser_path="$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath());')"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile browser-tools-chromium "%s" flags=(unconfined) {\n  userns,\n}\n' "$browser_path" | sudo tee /etc/apparmor.d/browser-tools-chromium
          sudo apparmor_parser -r /etc/apparmor.d/browser-tools-chromium
      - run: npm run smoke
